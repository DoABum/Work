<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>장기재직자 휴가 캘린더</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', 'Apple SD Gothic Neo', sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, #1e3a5f, #2d6a9f);
      color: white;
      padding: 16px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .header-left .icon { font-size: 22px; }
    header h1 { font-size: 19px; font-weight: 700; letter-spacing: -0.3px; }
    header .subtitle { font-size: 12px; opacity: 0.75; margin-top: 2px; }

    .live-status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      opacity: 0.9;
    }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #4caf50;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%,100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .dot.loading { background: #ffc107; animation: none; }
    .dot.error   { background: #f44336; animation: none; }

    .refresh-btn {
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.3);
      color: white;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .refresh-btn:hover { background: rgba(255,255,255,0.25); }

    .container {
      display: flex;
      gap: 20px;
      padding: 20px;
      max-width: 1400px;
      margin: 0 auto;
    }

    /* ── 캘린더 ────────────────────────────────────────── */
    .calendar-panel { flex: 1; display: flex; flex-direction: column; gap: 14px; }

    .month-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .month-card {
      background: white;
      border-radius: 12px;
      padding: 14px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    .month-title {
      text-align: center;
      font-size: 14px;
      font-weight: 700;
      color: #1e3a5f;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 2px solid #e8eef5;
    }

    .day-headers {
      display: grid;
      grid-template-columns: repeat(7,1fr);
      margin-bottom: 3px;
    }
    .day-header {
      text-align: center;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 0;
      color: #999;
    }
    .day-header.sun { color: #e74c3c; }
    .day-header.sat { color: #3498db; }

    .days-grid {
      display: grid;
      grid-template-columns: repeat(7,1fr);
      gap: 2px;
    }

    .day-cell {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.12s;
      user-select: none;
      position: relative;
    }
    .day-cell:hover:not(.empty):not(.blocked) { background: #e8f0fe; transform: scale(1.1); }
    .day-cell.empty { cursor: default; }
    .day-cell.sun { color: #e74c3c; }
    .day-cell.sat { color: #3498db; }
    .day-cell.today {
      font-weight: 700;
      outline: 2px solid #2d6a9f;
      outline-offset: -2px;
    }
    .day-cell.blocked {
      background: #f5f5f5 !important;
      color: #ccc !important;
      cursor: not-allowed;
      text-decoration: line-through;
    }
    .day-cell.selecting-start { background:#2d6a9f!important; color:white!important; font-weight:700; border-radius:5px; }
    .day-cell.in-range        { background:#cce0f5; color:#1e3a5f; border-radius:0; }
    .day-cell.range-start     { background:#2d6a9f!important; color:white!important; font-weight:700; border-radius:5px 0 0 5px; }
    .day-cell.range-end       { background:#2d6a9f!important; color:white!important; font-weight:700; border-radius:0 5px 5px 0; }
    .day-cell.range-single    { background:#2d6a9f!important; color:white!important; font-weight:700; border-radius:5px; }

    .day-cell.v0.in-range,.day-cell.v0.range-start,.day-cell.v0.range-end,.day-cell.v0.range-single { background:#cce0f5; color:#1e3a5f; }
    .day-cell.v1.in-range,.day-cell.v1.range-start,.day-cell.v1.range-end,.day-cell.v1.range-single { background:#d5f0e0; color:#1a5c3a; }
    .day-cell.v2.in-range,.day-cell.v2.range-start,.day-cell.v2.range-end,.day-cell.v2.range-single { background:#fde8cc; color:#7a3b00; }
    .day-cell.v3.in-range,.day-cell.v3.range-start,.day-cell.v3.range-end,.day-cell.v3.range-single { background:#e8d5f5; color:#4a1a7a; }
    .day-cell.v4.in-range,.day-cell.v4.range-start,.day-cell.v4.range-end,.day-cell.v4.range-single { background:#ffd5d5; color:#7a1a1a; }

    .day-cell.v0.range-start { border-radius:5px 0 0 5px; }
    .day-cell.v0.range-end   { border-radius:0 5px 5px 0; }
    .day-cell.v0.range-single,.day-cell.v1.range-single,.day-cell.v2.range-single,.day-cell.v3.range-single,.day-cell.v4.range-single { border-radius:5px; }
    .day-cell.v1.range-start,.day-cell.v2.range-start,.day-cell.v3.range-start,.day-cell.v4.range-start { border-radius:5px 0 0 5px; }
    .day-cell.v1.range-end,.day-cell.v2.range-end,.day-cell.v3.range-end,.day-cell.v4.range-end { border-radius:0 5px 5px 0; }

    /* tooltip */
    .day-cell .tip {
      display: none;
      position: absolute;
      bottom: calc(100% + 4px);
      left: 50%;
      transform: translateX(-50%);
      background: #333;
      color: white;
      font-size: 11px;
      white-space: nowrap;
      padding: 3px 7px;
      border-radius: 5px;
      z-index: 100;
      pointer-events: none;
    }
    .day-cell:hover .tip { display: block; }

    .hint-bar {
      background: white;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13px;
      color: #555;
      box-shadow: 0 1px 4px rgba(0,0,0,0.07);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .hint-bar .step-badge {
      background: #2d6a9f;
      color: white;
      border-radius: 12px;
      padding: 2px 10px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }

    /* ── 오른쪽 패널 ──────────────────────────────────── */
    .record-panel {
      width: 310px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .panel-card {
      background: white;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    .panel-title {
      font-size: 14px;
      font-weight: 700;
      color: #1e3a5f;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .panel-title .cnt {
      background: #2d6a9f;
      color: white;
      border-radius: 10px;
      padding: 1px 8px;
      font-size: 12px;
    }

    .stats-row { display: flex; gap: 8px; }
    .stat-box  { flex: 1; background: #f0f6ff; border-radius: 8px; padding: 10px; text-align: center; }
    .stat-box .sn { font-size: 22px; font-weight: 700; color: #2d6a9f; }
    .stat-box .sl { font-size: 11px; color: #888; margin-top: 2px; }

    .input-section { display: flex; flex-direction: column; gap: 9px; }
    .input-row { display: flex; align-items: center; gap: 7px; }
    .input-row label { font-size: 12px; color: #666; width: 34px; flex-shrink: 0; }

    .date-display {
      flex: 1;
      border: 1.5px solid #dde3ea;
      border-radius: 6px;
      padding: 6px 9px;
      font-size: 12px;
      color: #aaa;
      background: #fafbfc;
      min-height: 32px;
    }
    .date-display.filled { border-color: #2d6a9f; background: #f0f6ff; color: #1e3a5f; font-weight: 600; }

    .text-input {
      width: 100%;
      border: 1.5px solid #dde3ea;
      border-radius: 6px;
      padding: 6px 9px;
      font-size: 13px;
      color: #333;
      background: #fafbfc;
      outline: none;
      transition: border-color 0.2s;
    }
    .text-input:focus { border-color: #2d6a9f; background: #f0f6ff; }
    .text-input.invalid { border-color: #e74c3c; background: #fff5f5; }
    .text-input.invalid::placeholder { color: #e74c3c; }

    textarea.text-input { resize: none; height: 52px; }

    .btn-row { display: flex; gap: 7px; margin-top: 2px; }
    .btn {
      flex: 1;
      padding: 8px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-primary { background: #2d6a9f; color: white; }
    .btn-primary:hover { background: #1e5080; }
    .btn-primary:disabled { background: #aac4de; cursor: not-allowed; }
    .btn-secondary { background: #f0f2f5; color: #555; }
    .btn-secondary:hover { background: #e0e3e8; }

    .vacation-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
      max-height: 420px;
      overflow-y: auto;
      padding-right: 2px;
    }
    .vacation-list:empty::after {
      content: '등록된 휴가가 없습니다.';
      display: block;
      text-align: center;
      color: #bbb;
      font-size: 13px;
      padding: 18px 0;
    }

    .vacation-item {
      border-radius: 8px;
      padding: 10px 11px;
      position: relative;
      border-left: 4px solid;
    }
    .vacation-item.c0 { background:#eef6ff; border-color:#2d6a9f; }
    .vacation-item.c1 { background:#eefbf3; border-color:#27ae60; }
    .vacation-item.c2 { background:#fff8ee; border-color:#e67e22; }
    .vacation-item.c3 { background:#f5eeff; border-color:#8e44ad; }
    .vacation-item.c4 { background:#ffeeee; border-color:#e74c3c; }

    .vacation-item .v-name  { font-size: 13px; font-weight: 700; color: #222; margin-bottom: 3px; }
    .vacation-item .v-range { font-size: 12px; color: #555; margin-bottom: 2px; }
    .vacation-item .v-days  { font-size: 11px; color: #888; }
    .vacation-item .v-memo  { font-size: 11px; color: #777; margin-top: 4px; font-style: italic; }
    .vacation-item .v-ts    { font-size: 10px; color: #bbb; margin-top: 3px; }

    .btn-del {
      position: absolute;
      top: 7px; right: 7px;
      background: none;
      border: none;
      color: #ccc;
      cursor: pointer;
      font-size: 13px;
      padding: 2px 4px;
      border-radius: 4px;
      transition: all 0.15s;
      line-height: 1;
    }
    .btn-del:hover { background: #ffe0e0; color: #e74c3c; }

    /* toast */
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #333;
      color: white;
      padding: 10px 20px;
      border-radius: 24px;
      font-size: 13px;
      transition: transform 0.3s;
      z-index: 999;
      pointer-events: none;
    }
    #toast.show { transform: translateX(-50%) translateY(0); }
    #toast.success { background: #27ae60; }
    #toast.error   { background: #e74c3c; }
  </style>
</head>
<body>

<header>
  <div class="header-left">
    <span class="icon">🏖️</span>
    <div>
      <h1>장기재직자 휴가 캘린더</h1>
      <div class="subtitle">2026년 8월 ~ 2027년 1월</div>
    </div>
  </div>
  <div class="live-status">
    <div class="dot" id="statusDot"></div>
    <span id="statusText">연결 중…</span>
    <button class="refresh-btn" onclick="fetchData(true)">↻ 새로고침</button>
  </div>
</header>

<div id="toast"></div>

<div class="container">

  <!-- 캘린더 -->
  <div class="calendar-panel">
    <div class="hint-bar" id="hintBar">
      <span class="step-badge" id="stepBadge">1단계</span>
      <span id="hintText">캘린더에서 휴가 시작일을 클릭하세요.</span>
    </div>
    <div class="month-grid" id="monthGrid"></div>
  </div>

  <!-- 오른쪽 패널 -->
  <div class="record-panel">

    <div class="panel-card">
      <div class="stats-row">
        <div class="stat-box">
          <div class="sn" id="statCount">0</div>
          <div class="sl">등록 건수</div>
        </div>
        <div class="stat-box">
          <div class="sn" id="statDays">0</div>
          <div class="sl">총 평일 일수</div>
        </div>
      </div>
    </div>

    <div class="panel-card">
      <div class="panel-title">✏️ 휴가 등록</div>
      <div class="input-section">
        <div>
          <label style="font-size:12px;color:#666;display:block;margin-bottom:4px;">성명 <span style="color:#e74c3c">*</span></label>
          <input type="text" class="text-input" id="nameInput" placeholder="이름을 입력하세요" maxlength="20">
        </div>
        <div class="input-row">
          <label>시작</label>
          <div class="date-display" id="startDisplay">날짜를 클릭하세요</div>
        </div>
        <div class="input-row">
          <label>종료</label>
          <div class="date-display" id="endDisplay">날짜를 클릭하세요</div>
        </div>
        <div>
          <label style="font-size:12px;color:#666;display:block;margin-bottom:4px;">메모 (선택)</label>
          <textarea class="text-input" id="memoInput" placeholder="비고 사항"></textarea>
        </div>
        <div class="btn-row">
          <button class="btn btn-secondary" onclick="resetSel()">초기화</button>
          <button class="btn btn-primary" id="addBtn" onclick="addVacation()" disabled>등록</button>
        </div>
      </div>
    </div>

    <div class="panel-card">
      <div class="panel-title">
        📋 휴가 목록
        <span class="cnt" id="listCnt">0</span>
      </div>
      <div class="vacation-list" id="vacList"></div>
    </div>

  </div>
</div>

<script>
// ── 상수 ──────────────────────────────────────────────────
const MONTHS = [
  {year:2026,month:8},{year:2026,month:9},{year:2026,month:10},
  {year:2026,month:11},{year:2026,month:12},{year:2027,month:1}
];
const MN  = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
const DN  = ['일','월','화','수','목','금','토'];
const CLR = ['#2d6a9f','#27ae60','#e67e22','#8e44ad','#e74c3c'];

// ── 상태 ──────────────────────────────────────────────────
let vacations = [];
let blocked   = new Set();
let selStart  = null;
let selEnd    = null;
let hoverDate = null;
const today   = toKey(new Date());

// ── 유틸 ──────────────────────────────────────────────────
function toKey(d) {
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
function pad(n) { return String(n).padStart(2,'0'); }
function keyToDate(k) { const [y,m,d]=k.split('-').map(Number); return new Date(y,m-1,d); }
function kor(k) {
  if (!k) return '';
  const [y,m,d]=k.split('-').map(Number);
  return `${y}년 ${m}월 ${d}일`;
}
function workdays(s,e) {
  let cnt=0, cur=keyToDate(s), end=keyToDate(e);
  while(cur<=end){const w=cur.getDay();if(w&&w!==6)cnt++;cur.setDate(cur.getDate()+1);}
  return cnt;
}
function totalDays(s,e) { return Math.round((keyToDate(e)-keyToDate(s))/86400000)+1; }
function inRange(d,s,e) { return d>=s&&d<=e; }
function colorIdx(id)   { return id%5; }
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── API ───────────────────────────────────────────────────
async function fetchData(manual=false) {
  setStatus('loading','불러오는 중…');
  try {
    const [vRes, bRes] = await Promise.all([
      fetch('/api/vacations'), fetch('/api/blocked')
    ]);
    if (!vRes.ok || !bRes.ok) throw new Error('서버 오류');
    const vData = await vRes.json();
    const bData = await bRes.json();
    vacations = vData;
    blocked   = new Set(bData.map(b=>b.date));
    renderAll();
    const now = new Date();
    setStatus('ok', `${pad(now.getHours())}:${pad(now.getMinutes())} 업데이트`);
    if (manual) toast('최신 데이터로 새로고침했습니다.', 'success');
  } catch(e) {
    setStatus('error', '연결 오류');
    if (manual) toast('서버에 연결할 수 없습니다.', 'error');
  }
}

async function addVacation() {
  const name = document.getElementById('nameInput').value.trim();
  const ni   = document.getElementById('nameInput');
  if (!name) {
    ni.classList.add('invalid');
    ni.placeholder = '이름을 입력해주세요!';
    ni.focus();
    return;
  }
  ni.classList.remove('invalid');
  if (!selStart || !selEnd) return;

  const memo = document.getElementById('memoInput').value.trim();
  const btn  = document.getElementById('addBtn');
  btn.disabled = true;
  btn.textContent = '등록 중…';

  try {
    const res = await fetch('/api/vacations', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({name, start:selStart, end:selEnd, memo})
    });
    if (!res.ok) throw new Error();
    toast(`${esc(name)} 선생님 휴가가 등록되었습니다.`, 'success');
    resetSel();
    await fetchData();
  } catch(e) {
    toast('등록에 실패했습니다. 다시 시도해주세요.', 'error');
    btn.disabled = false;
    btn.textContent = '등록';
  }
}

async function delVacation(id, name) {
  if (!confirm(`"${name}" 선생님의 휴가를 삭제하시겠습니까?`)) return;
  try {
    await fetch(`/api/vacations/${id}`, {method:'DELETE'});
    toast('삭제되었습니다.', 'success');
    await fetchData();
  } catch(e) {
    toast('삭제에 실패했습니다.', 'error');
  }
}

// ── 캘린더 렌더링 ─────────────────────────────────────────
function renderAll() {
  const grid = document.getElementById('monthGrid');
  grid.innerHTML = '';
  MONTHS.forEach(({year,month}) => grid.appendChild(buildMonth(year,month)));
  renderList();
  updateStats();
}

function buildMonth(year, month) {
  const card = document.createElement('div');
  card.className = 'month-card';

  const title = document.createElement('div');
  title.className = 'month-title';
  title.textContent = `${year}년 ${MN[month-1]}`;
  card.appendChild(title);

  const hdrs = document.createElement('div');
  hdrs.className = 'day-headers';
  DN.forEach((n,i) => {
    const h = document.createElement('div');
    h.className = 'day-header'+(i===0?' sun':i===6?' sat':'');
    h.textContent = n;
    hdrs.appendChild(h);
  });
  card.appendChild(hdrs);

  const dg = document.createElement('div');
  dg.className = 'days-grid';

  const firstDow = new Date(year, month-1, 1).getDay();
  const daysInM  = new Date(year, month, 0).getDate();

  for (let i=0;i<firstDow;i++) {
    const e=document.createElement('div');
    e.className='day-cell empty';
    dg.appendChild(e);
  }

  for (let d=1;d<=daysInM;d++) {
    const key = `${year}-${pad(month)}-${pad(d)}`;
    const dow = new Date(year,month-1,d).getDay();
    const cell = document.createElement('div');
    cell.textContent = d;
    cell.dataset.key = key;

    const cls = ['day-cell'];
    if (dow===0) cls.push('sun');
    if (dow===6) cls.push('sat');
    if (key===today) cls.push('today');

    if (blocked.has(key)) {
      cls.push('blocked');
    } else {
      applyStyle(cls, cell, key);
      cell.addEventListener('click', ()=>onDayClick(key));
      cell.addEventListener('mouseenter', ()=>onHover(key));
      cell.addEventListener('mouseleave', ()=>{hoverDate=null;renderAll();});
    }

    cell.className = cls.join(' ');
    dg.appendChild(cell);
  }

  card.appendChild(dg);
  return card;
}

function applyStyle(cls, cell, key) {
  // 저장된 휴가 강조
  for (let i=0;i<vacations.length;i++) {
    const v = vacations[i];
    if (!inRange(key, v.start, v.end)) continue;
    const ci = colorIdx(v.id);
    cls.push(`v${ci}`);
    markRange(cls, key, v.start, v.end);

    // 툴팁
    const tip = document.createElement('div');
    tip.className = 'tip';
    tip.textContent = v.name;
    cell.appendChild(tip);
    return;
  }

  // 선택 중 강조
  const effEnd = (selStart && !selEnd && hoverDate) ? hoverDate : selEnd;
  if (selStart && effEnd) {
    const s = selStart<=effEnd ? selStart : effEnd;
    const e = selStart<=effEnd ? effEnd   : selStart;
    if (inRange(key, s, e)) {
      if (key===s && key===e) cls.push('range-single','selecting-start');
      else if (key===s)       cls.push('range-start','selecting-start');
      else if (key===e)       cls.push('range-end','selecting-start');
      else                    cls.push('in-range');
    }
  } else if (selStart && key===selStart) {
    cls.push('selecting-start');
  }
}

function markRange(cls, key, s, e) {
  if (s===e)      cls.push('range-single');
  else if (key===s) cls.push('range-start');
  else if (key===e) cls.push('range-end');
  else              cls.push('in-range');
}

// ── 클릭 / 호버 ───────────────────────────────────────────
function onHover(key) {
  if (selStart && !selEnd) { hoverDate=key; renderAll(); }
}
function onDayClick(key) {
  if (blocked.has(key)) return;
  if (!selStart) {
    selStart=key; selEnd=null; hoverDate=null;
    setHint(2,'종료일을 클릭하세요. (같은 날 클릭하면 당일 처리)');
    updateForm();
  } else if (!selEnd) {
    if (key<selStart){selEnd=selStart;selStart=key;}
    else selEnd=key;
    hoverDate=null;
    setHint(3,'성명 확인 후 [등록] 버튼을 누르세요.');
    updateForm();
  } else {
    selStart=key; selEnd=null; hoverDate=null;
    setHint(2,'종료일을 클릭하세요.');
    updateForm();
  }
  renderAll();
}

function setHint(step, msg) {
  document.getElementById('stepBadge').textContent = `${step}단계`;
  document.getElementById('hintText').textContent  = msg;
}

function updateForm() {
  const sd=document.getElementById('startDisplay');
  const ed=document.getElementById('endDisplay');
  const btn=document.getElementById('addBtn');
  if (selStart) { sd.textContent=kor(selStart); sd.classList.add('filled'); }
  else          { sd.textContent='날짜를 클릭하세요'; sd.classList.remove('filled'); }
  if (selEnd)   { ed.textContent=kor(selEnd); ed.classList.add('filled'); }
  else if (selStart) { ed.textContent='종료일 선택 중…'; ed.classList.add('filled'); }
  else          { ed.textContent='날짜를 클릭하세요'; ed.classList.remove('filled'); }
  btn.disabled = !(selStart && selEnd);
  btn.textContent = '등록';
}

function resetSel() {
  selStart=null; selEnd=null; hoverDate=null;
  document.getElementById('nameInput').value='';
  document.getElementById('nameInput').classList.remove('invalid');
  document.getElementById('nameInput').placeholder='이름을 입력하세요';
  document.getElementById('memoInput').value='';
  setHint(1,'캘린더에서 휴가 시작일을 클릭하세요.');
  updateForm();
  renderAll();
}

// ── 목록 / 통계 ───────────────────────────────────────────
function renderList() {
  const list = document.getElementById('vacList');
  document.getElementById('listCnt').textContent = vacations.length;
  list.innerHTML = '';
  [...vacations].reverse().forEach(v => {
    const days = totalDays(v.start, v.end);
    const ci   = colorIdx(v.id);
    const item = document.createElement('div');
    item.className = `vacation-item c${ci}`;
    item.innerHTML = `
      <button class="btn-del" onclick="delVacation(${v.id},'${esc(v.name)}')" title="삭제">✕</button>
      <div class="v-name">${esc(v.name)}</div>
      <div class="v-range">📅 ${kor(v.start)} ~ ${kor(v.end)}</div>
      <div class="v-days">총 ${days}일 (평일 ${workdays(v.start,v.end)}일)</div>
      ${v.memo ? `<div class="v-memo">💬 ${esc(v.memo)}</div>` : ''}
      <div class="v-ts">등록: ${v.ts || ''}</div>
    `;
    list.appendChild(item);
  });
}

function updateStats() {
  document.getElementById('statCount').textContent = vacations.length;
  const total = vacations.reduce((s,v)=>s+workdays(v.start,v.end),0);
  document.getElementById('statDays').textContent  = total;
}

// ── 상태 표시 ──────────────────────────────────────────────
function setStatus(state, msg) {
  const dot  = document.getElementById('statusDot');
  const text = document.getElementById('statusText');
  dot.className  = 'dot '+state;
  text.textContent = msg;
}

// ── 토스트 ────────────────────────────────────────────────
let _toastTimer;
function toast(msg, type='') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className   = 'show '+(type||'');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(()=>{ el.className=''; }, 3000);
}

// ── 자동 새로고침 (30초) ─────────────────────────────────
setInterval(()=>fetchData(), 30000);

// ── 초기 실행 ─────────────────────────────────────────────
fetchData();
updateForm();
</script>
</body>
</html>
